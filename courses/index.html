<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Courses — liste à deux</title>
<meta name="description" content="Liste de courses partagée : on ajoute, on coche au magasin.">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f8f4;--card:#fff;--ink:#263026;--muted:#829184;--line:#dce7dc;--radius:16px;--green:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:10;background:rgba(244,248,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#43a047,#1b5e20);display:grid;place-items:center;font-size:20px}
main{padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;box-shadow:0 4px 18px rgba(46,125,50,.07)}
.state{background:linear-gradient(135deg,#43a047,#1b5e20);color:#fff;border:none}
.state .big{font-size:20px;font-weight:800;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 10px;font-size:13px}
.avchip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.codebox{font-size:26px;font-weight:800;letter-spacing:.2em;text-align:center;background:rgba(255,255,255,.15);border:2px dashed #fff;border-radius:12px;padding:10px;margin:10px 0;color:#fff}
label.section{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;display:block}
input[type=text]{border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;width:100%;font-family:inherit}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#e3edE3;color:#1b5e20}
.btn.primary{background:var(--green);color:#fff}
.btn.danger{background:#fff;color:#b71c1c;border:1.5px solid #ef9a9a}
.colorpick{display:flex;gap:8px;margin-top:8px}
.cpick{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.cpick.on{border-color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.check{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--green);flex-shrink:0;display:grid;place-items:center;font-size:16px;color:#fff;background:#fff}
.item.done .check{background:var(--green)}
.item .name{flex:1;font-size:16px}
.item.done .name{text-decoration:line-through;color:var(--muted)}
.item.done{background:#f7faf7}
.who{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.del{border:none;background:none;font-size:18px;color:#c5cfc5;cursor:pointer;padding:6px}
.sect{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
footer{padding:24px 0;text-align:center}
</style>
</head>
<body>
<header><div class="wrap topbar">
  <div class="brand"><span class="logo">🛒</span> Courses</div>
  <span class="avchip" id="meChip"></span>
</div></header>

<main class="wrap">

  <div class="card hidden" id="joinCard">
    <h3 style="margin:0 0 4px">👋 La liste à deux</h3>
    <p class="muted">Pseudo + couleur, puis crée l'espace et envoie le code à ta compagne (ou rejoins le sien).</p>
    <label class="section">Ton pseudo</label>
    <input type="text" id="pseudo" maxlength="16" placeholder="Ex : Alex">
    <label class="section">Ta couleur</label>
    <div class="colorpick" id="colorPick"></div>
    <label class="section">Code d'espace</label>
    <input type="text" id="roomInput" maxlength="6" placeholder="Ex : K7Q2XA" style="text-transform:uppercase">
    <div class="btnrow">
      <button class="btn primary" id="createBtn">Créer un espace</button>
      <button class="btn" id="joinBtn">Rejoindre</button>
    </div>
  </div>

  <div class="card state hidden" id="roomCard">
    <small id="progress">0/0 pris</small>
    <div class="big" id="roomTitle">Liste</div>
    <div class="codebox" id="roomCode">——————</div>
    <div class="btnrow">
      <button class="btn" id="copyBtn" style="background:rgba(255,255,255,.2);color:#fff">Copier le lien</button>
      <button class="btn" id="leaveBtn" style="background:rgba(255,255,255,.2);color:#fff">Quitter</button>
    </div>
  </div>

  <div class="card hidden" id="listCard">
    <div class="addrow">
      <input type="text" id="newItem" maxlength="60" placeholder="Ajouter : lait, pain…" autocomplete="off">
      <button class="btn primary" id="addBtn">＋</button>
    </div>
    <div id="todoSect"><div class="sect">À prendre (<span id="todoN">0</span>)</div><div id="todo"></div></div>
    <div id="doneSect"><div class="sect">Pris ✓ (<span id="doneN">0</span>)</div><div id="done"></div></div>
    <div class="btnrow">
      <button class="btn" id="clearDoneBtn">Retirer les pris ✓</button>
      <button class="btn danger" id="clearAllBtn">Tout supprimer 🗑</button>
    </div>
  </div>

  <footer class="muted">🛒 Synchro en direct à deux.</footer>
</main>

<script>
/* Même base Firebase que Caca (projet caca-24706).
   RÈGLE À AJOUTER dans Firestore → Règles (à côté de /entries) :
     match /shop_items/{id} {
       allow read, write: if request.auth != null;
     }
   puis Publier. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBLa4c5CE7nmCEEdMhqw52MAWwya4EAM8E",
  authDomain: "caca-24706.firebaseapp.com",
  projectId: "caca-24706",
};
const COLORS = ['#3a6ea5','#ef6c00','#43a047','#8e24aa','#c62828','#00838f'];
let me = JSON.parse(localStorage.getItem('shop-me') || 'null');
let room = new URLSearchParams(location.search).get('room') || localStorage.getItem('shop-room') || null;
let items = [], unsub = null, uid = null;
(function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().signInAnonymously().then(c => { uid = c.user.uid; buildStatic(); refresh(); }).catch(e => alert("Connexion impossible : " + e.message));
})();

function buildStatic(){
  const cp=document.getElementById('colorPick');
  cp.innerHTML=COLORS.map(c=>`<span class="cpick" data-c="${c}" style="background:${c}"></span>`).join('');
  const myColor = me?.color || COLORS[2];
  cp.querySelectorAll('.cpick').forEach(s=>{
    if(s.dataset.c===myColor)s.classList.add('on');
    s.onclick=()=>{ cp.querySelectorAll('.cpick').forEach(x=>x.classList.remove('on')); s.classList.add('on'); };
  });
  if(me)document.getElementById('pseudo').value=me.pseudo;
  document.getElementById('createBtn').onclick=()=>{ if(!checkPseudo())return; room=genCode(); saveMe(); enterRoom(); };
  document.getElementById('joinBtn').onclick=()=>{ if(!checkPseudo())return; const c=document.getElementById('roomInput').value.trim().toUpperCase(); if(c.length!==6){alert('Code à 6 lettres/chiffres.');return;} room=c; saveMe(); enterRoom(); };
  document.getElementById('copyBtn').onclick=()=>{ const u=location.origin+location.pathname+'?room='+room; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Lien copié ! Envoie-le à ta compagne.')).catch(()=>prompt('Copie ce lien :',u)); };
  document.getElementById('leaveBtn').onclick=()=>{ if(confirm('Quitter cet espace ? La liste reste enregistrée.')){ room=null; localStorage.removeItem('shop-room'); if(unsub)unsub(); if(location.search)history.replaceState(null,'',location.pathname); refresh(); } };
  const add=()=>{ const i=document.getElementById('newItem'),v=i.value.trim().slice(0,60); if(!v)return; i.value='';
    firebase.firestore().collection('shop_items').add({room,author:uid,pseudo:me.pseudo,color:me.color,name:v,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),ts:Date.now()}).catch(e=>alert('Ajout impossible : '+e.message)); };
  document.getElementById('addBtn').onclick=add;
  document.getElementById('newItem').addEventListener('keydown',e=>{ if(e.key==='Enter')add(); });
  document.getElementById('clearDoneBtn').onclick=()=>{ const ds=items.filter(i=>i.done); if(!ds.length||!confirm(`Retirer les ${ds.length} article(s) pris ?`))return; const b=firebase.firestore().batch(); ds.forEach(i=>b.delete(firebase.firestore().collection('shop_items').doc(i.id))); b.commit().catch(e=>alert(e.message)); };
  document.getElementById('clearAllBtn').onclick=()=>{ if(!items.length||!confirm(`Tout supprimer (${items.length} article(s)) ? La liste sera vide.`))return; const b=firebase.firestore().batch(); items.forEach(i=>b.delete(firebase.firestore().collection('shop_items').doc(i.id))); b.commit().catch(e=>alert(e.message)); };
}
function genCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)]; return s; }
function checkPseudo(){
  const p=document.getElementById('pseudo').value.trim().slice(0,16);
  if(!p){ alert('Choisis un pseudo !'); return false; }
  const c=document.querySelector('#colorPick .cpick.on');
  me={pseudo:p,color:c?c.dataset.c:COLORS[2]};
  return true;
}
function saveMe(){ localStorage.setItem('shop-me',JSON.stringify(me)); localStorage.setItem('shop-room',room); }
function enterRoom(){ saveMe(); history.replaceState(null,'','?room='+room); refresh(); }
function refresh(){
  const inRoom = !!(room && me);
  document.getElementById('joinCard').classList.toggle('hidden',inRoom);
  document.getElementById('roomCard').classList.toggle('hidden',!inRoom);
  document.getElementById('listCard').classList.toggle('hidden',!inRoom);
  if(!inRoom){ const c=new URLSearchParams(location.search).get('room'); if(c)document.getElementById('roomInput').value=c; return; }
  document.getElementById('meChip').innerHTML=`<span class="dot" style="background:${me.color}"></span> ${me.pseudo}`;
  document.getElementById('roomCode').textContent=room;
  if(!location.search.includes(room))history.replaceState(null,'','?room='+room);
  if(unsub)unsub();
  unsub=firebase.firestore().collection('shop_items').where('room','==',room).onSnapshot(snap=>{
    items=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>alert('Lecture impossible (règle shop_items ajoutée ?) : '+err.message));
}
function render(){
  const todo=items.filter(i=>!i.done).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const done=items.filter(i=>i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  document.getElementById('roomTitle').textContent = items.length?`${done.length}/${items.length} pris`:'Liste vide — ajoute !';
  document.getElementById('progress').textContent = items.length?`${done.length}/${items.length} pris`:'Liste commune';
  document.getElementById('todoN').textContent=todo.length;
  document.getElementById('doneN').textContent=done.length;
  document.getElementById('todoSect').style.display=todo.length?'':'none';
  document.getElementById('doneSect').style.display=done.length?'':'none';
  const html=list=>list.map(i=>`
    <div class="item${i.done?' done':''}" data-id="${i.id}">
      <span class="check">${i.done?'✓':''}</span>
      <span class="name">${escapeHtml(i.name)}</span>
      <span class="who"><span class="dot" style="background:${i.color}"></span>${escapeHtml(i.pseudo)}</span>
      <button class="del" data-del="${i.id}" aria-label="Supprimer">✕</button>
    </div>`).join('');
  document.getElementById('todo').innerHTML=html(todo)||'';
  document.getElementById('done').innerHTML=html(done)||'';
  document.querySelectorAll('.item').forEach(el=>{
    el.onclick=e=>{
      if(e.target.dataset.del){ firebase.firestore().collection('shop_items').doc(e.target.dataset.del).delete(); return; }
      const it=items.find(x=>x.id===el.dataset.id); if(!it)return;
      firebase.firestore().collection('shop_items').doc(it.id).update({done:!it.done,doneAt:Date.now(),doneBy:me.pseudo});
    };
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
